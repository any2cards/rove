<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<p>Select Games / Expansions / Assets:</p>
		<div class="top">
			<div>
				<details id="ag-details">
					<summary><input type="checkbox" id="ag" value="ag">
						<label for="ag">Addax Games Official Content</label><br>
					</summary>
					<div class="indent">
						<details id="rv-details">
							<summary><input type="checkbox" id="rv" value="rv">
								<label for="rv">Rove</label><br>
							</summary>
							<div class="indent">
								<input type="checkbox" id="rv-abilities" value="rv-abilities">
								<label for="rv-abilities">Abilities</label><br>
							</div>
							<div class="indent">
								<input type="checkbox" id="rv-allies" value="rv-allies">
								<label for="rv-allies">Allies</label><br>
							</div>
							<div class="indent">
								<input type="checkbox" id="rv-classes" value="rv-classes">
								<label for="rv-classes">Classes</label><br>
							</div>
							<div class="indent">
								<input type="checkbox" id="rv-items" value="rv-items">
								<label for="rv-items">Items</label><br>
							</div>
							<div class="indent">
								<input type="checkbox" id="rv-profile-boards" value="rv-profile-boards">
								<label for="rv-profile-boards">Profile Boards</label><br>
							</div>
							<div class="indent">
								<input type="checkbox" id="rv-traits" value="rv-traits">
								<label for="rv-traits">Traits</label><br>
							</div>
						</details>
					</div>
				</details>
			</div>
		</div>
		<script src="popup.js"></script>
	</body>
</html>
