<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<p>Select Games / Expansions / Assets:</p>
		<div class="top">
			<div>
				<details id="ag-details">
					<summary><input type="checkbox" id="ag" value="ag">
						<label for="ag">Addax Games Official Content</label><br>
					</summary>
					<div class="indent">
						<details id="rv-details">
							<summary><input type="checkbox" id="rv" value="rv">
								<label for="rv">Rove</label><br>
							</summary>
							<div class="indent">
								<details id="bs-details">
									<summary><input type="checkbox" id="bs" value="bs">
										<label for="bs">Base</label><br>
									</summary>
									<div class="indent">
										<input type="checkbox" id="bs-abilities" value="bs-abilities">
										<label for="bs-abilities">Abilities</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="bs-allies" value="bs-allies">
										<label for="bs-allies">Allies</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="bs-art" value="bs-art">
										<label for="bs-art">Art</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="bs-classes" value="bs-classes">
										<label for="bs-classes">Classes</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="bs-items" value="bs-items">
										<label for="bs-items">Items (Level 1, Starting)</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="bs-profile-boards" value="bs-profile-boards">
										<label for="bs-profile-boards">Profile Boards</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="bs-traits" value="bs-traits">
										<label for="bs-traits">Traits</label><br>
									</div>
								</details>
							</div>
							<div class="indent">
								<details id="pr-details">
									<summary><input type="checkbox" id="pr" value="pr">
										<label for="pr">Prime</label><br>
									</summary>
									<div class="indent">
										<input type="checkbox" id="pr-abilities" value="pr-abilities">
										<label for="pr-abilities">Abilities</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="pr-art" value="pr-art">
										<label for="pr-art">Art</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="pr-classes" value="pr-classes">
										<label for="pr-classes">Classes</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="pr-profile-boards" value="pr-profile-boards">
										<label for="pr-profile-boards">Profile Boards</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="pr-traits" value="pr-traits">
										<label for="pr-traits">Traits</label><br>
									</div>
								</details>
							</div>
							<div class="indent">
								<details id="ap-details">
									<summary><input type="checkbox" id="ap" value="ap">
										<label for="ap">Apex</label><br>
									</summary>
									<div class="indent">
										<input type="checkbox" id="ap-abilities" value="ap-abilities">
										<label for="ap-abilities">Abilities</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="ap-art" value="ap-art">
										<label for="ap-art">Art</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="ap-classes" value="ap-classes">
										<label for="ap-classes">Classes</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="ap-profile-boards" value="ap-profile-boards">
										<label for="ap-profile-boards">Profile Boards</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="ap-traits" value="ap-traits">
										<label for="ap-traits">Traits</label><br>
									</div>
								</details>
							</div>
							<div class="indent">
								<details id="ot-details">
									<summary><input type="checkbox" id="ot" value="ot">
										<label for="ot">Other</label><br>
									</summary>
									<div class="indent">
										<input type="checkbox" id="ot-art" value="ot-art">
										<label for="ot-art">Art</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="ot-classes" value="ot-classes">
										<label for="ot-classes">Classes</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="ot-items" value="ot-items">
										<label for="ot-items">Items (Levels 2 - 4, Reward, Secret, Xulc)</label><br>
									</div>
									<div class="indent">
										<input type="checkbox" id="ot-traits" value="ot-traits">
										<label for="ot-traits">Traits</label><br>
									</div>
								</details>
							</div>
						</details>
					</div>
				</details>
			</div>
		</div>
		<script src="popup.js"></script>
	</body>
</html>
