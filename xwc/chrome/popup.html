<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<p>Select Games / Expansions / Assets:</p>

							</summary>
							<div class="indent">

									</div>
									<div class="indent">
										<input type="checkbox" id="co-profile-boards" value="co-profile-boards">

									</div>
									<div class="indent">
										<input type="checkbox" id="co-traits" value="co-traits">
										<label for="co-traits">Traits</label><br>
									</div>
								</details>
							</div>
							<div class="indent">
								<details id="xu-details">
									<summary><input type="checkbox" id="xu" value="xu">
										<label for="xu">Xulc</label><br>
									</summary>

										<input type="checkbox" id="xu-abilities" value="xu-abilities">

										<input type="checkbox" id="xu-allies" value="xu-allies">

									</div>
									<div class="indent">
										<input type="checkbox" id="xu-art" value="xu-art">

									</div>
									<div class="indent">
										<input type="checkbox" id="xu-classes" value="xu-classes">

									<div class="indent">
										<input type="checkbox" id="xu-items" value="xu-items">

									<div class="indent">
										<input type="checkbox" id="xu-profile-boards" value="xu-profile-boards">

									<div class="indent">
										<input type="checkbox" id="xu-traits" value="xu-traits">

									</div>
								</details>
							</div>
							<div class="indent">
								<details id="gm-details">
									<summary><input type="checkbox" id="gm" value="gm">
										<label for="gm">Game</label><br>

									<div class="indent">
										<input type="checkbox" id="gm-art" value="gm-art">
